<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Visualizzazione architettonica fotorealistica e tecnica</title>
<desc id="desc">Composizione professionale di un edificio contemporaneo che passa da nuvola di punti e wireframe a visualizzazione renderizzata.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff2ff"/><stop offset=".58" stop-color="#f8fbfe"/><stop offset="1" stop-color="#d6e6ef"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8fd3ff" stop-opacity=".88"/><stop offset=".55" stop-color="#315f7d" stop-opacity=".92"/><stop offset="1" stop-color="#17384f"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7a4a2f"/><stop offset=".5" stop-color="#b87d50"/><stop offset="1" stop-color="#5c3827"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f8f8"/><stop offset="1" stop-color="#c7d0d5"/></linearGradient>
  <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#55c9e8"/><stop offset="1" stop-color="#1f7ea4"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#fff7c6"/><stop offset="1" stop-color="#fff7c6" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#082f50" flood-opacity=".22"/></filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.8" fill="#4da8d8" opacity=".55"/><circle cx="15" cy="11" r="1.2" fill="#0b4f77" opacity=".4"/></pattern>
  <clipPath id="leftHalf"><rect width="600" height="675"/></clipPath>
</defs>
<rect width="1200" height="675" rx="34" fill="url(#sky)"/>
<circle cx="985" cy="96" r="150" fill="url(#sun)"/>
