name: Add reviews section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-reviews-section.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add customer reviews section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          section = '''<section id="recensioni" class="section reviews-section"><div class="wrap"><div class="section-heading"><p class="eyebrow">RECENSIONI E COMMENTI</p><h2>Cosa dicono i clienti</h2><p>In questa sezione vengono raccolti brevi commenti e recensioni reali dei clienti sui lavori AutoCAD, Revit/BIM e di disegno tecnico svolti.</p></div><div class="reviews-grid" aria-live="polite"><article class="review-card review-empty"><div class="review-mark" aria-hidden="true">“</div><p>Le recensioni dei clienti verranno pubblicate qui in forma sintetica, utilizzando solo commenti reali e autorizzati.</p><span>Recensioni clienti</span></article></div></div></section>'''
          marker = '</main><footer>'
          if 'id="recensioni"' not in s and marker in s:
            s = s.replace(marker, section + '</main><footer>')
          p.write_text(s, encoding='utf-8')

          p = Path('enhancements.css')
          css = p.read_text(encoding='utf-8')
          add = '''\n/* Recensioni clienti */\n.reviews-section{background:linear-gradient(180deg,#f8fbfe 0%,#eef6fc 100%);border-top:1px solid #dce8f1}\n.reviews-section .section-heading{max-width:860px}\n.reviews-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:26px}\n.review-card{position:relative;min-height:180px;padding:24px;border:1px solid #d7e2ec;border-radius:18px;background:#fff;box-shadow:0 10px 28px rgba(11,58,91,.07);display:flex;flex-direction:column;justify-content:space-between}\n.review-card p{margin:16px 0;color:#334f67;font-size:16px;line-height:1.65}\n.review-card span{font-size:13px;font-weight:800;color:#6d8193;text-transform:uppercase;letter-spacing:.06em}\n.review-mark{position:absolute;top:8px;right:18px;font-size:56px;line-height:1;color:#d8e9f5;font-family:Georgia,serif}\n.review-empty{grid-column:1/-1;min-height:120px;background:linear-gradient(135deg,#fff,#f7fbfe)}\n@media(max-width:850px){.reviews-grid{grid-template-columns:1fr 1fr}}\n@media(max-width:576px){.reviews-grid{grid-template-columns:1fr}.review-card{padding:20px;border-radius:14px}}\n'''
          if '/* Recensioni clienti */' not in css:
            css += add
          p.write_text(css, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html enhancements.css
          if ! git diff --cached --quiet; then
            git commit -m "Add customer reviews section"
            git push
          fi
