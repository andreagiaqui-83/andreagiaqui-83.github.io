name: Mobile render polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-render-polish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine mobile render and services presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'landing-stable-20260915\.css\?v=[^"\']+', 'landing-stable-20260915.css?v=20260915-1515', s, count=1)
          s=re.sub(r'data-build="[^"]+"', 'data-build="20260915-1515"', s, count=1)

          # Keep the isolated render figure but switch to the verified photorealistic before/after asset.
          s=re.sub(
              r'(<figure class="render-pro-figure"[^>]*>\s*<img\s+src=")[^"]+("[^>]*>)',
              r'\1assets/render-model-to-reality.webp?v=20260915-1515\2',
              s,
              count=1,
              flags=re.S,
          )
          # Normalize the image intrinsic dimensions/alt without touching the rest of the figure.
          s=re.sub(
              r'(<figure class="render-pro-figure"[^>]*>\s*<img[^>]*?)\s+width="[^"]+"\s+height="[^"]+"',
              r'\1 width="1400" height="788"',
              s,
              count=1,
              flags=re.S,
          )
          s=re.sub(
              r'(<figure class="render-pro-figure"[^>]*>\s*<img[^>]*?)alt="[^"]*"',
              r'\1alt="Dal modello tecnico 3D al render fotorealistico di una villa moderna"',
              s,
              count=1,
              flags=re.S,
          )
          p.write_text(s,encoding='utf-8')

          p=Path('landing-stable-20260915.css')
          css=p.read_text(encoding='utf-8')
          marker='/* Mobile refinement 2026-09-15 15:15 */'
          if marker not in css:
              css += '''\n\n/* Mobile refinement 2026-09-15 15:15 */\n.render-pro-figure img{object-fit:cover!important;object-position:center!important}\n@media(max-width:640px){\n  .render-section{padding:48px 0 54px!important}\n  .render-pro-layout{gap:20px!important}\n  .render-copy h2{font-size:clamp(30px,8.8vw,39px)!important;line-height:1.08!important}\n  .render-copy>p{font-size:16px!important;line-height:1.6!important}\n  .render-points{grid-template-columns:1fr!important;gap:10px!important;margin:20px 0!important}\n  .render-points li{padding:13px 13px 13px 38px!important;font-size:15px!important}\n  .render-location-note{margin:16px 0 18px!important;padding:14px 15px!important;font-size:14px!important}\n  .render-actions{margin:0!important;justify-content:flex-start!important}\n  .render-actions .button.primary{width:auto!important;min-width:0!important;max-width:260px!important;padding:13px 18px!important;border-radius:12px!important;font-size:16px!important;background:#fff!important;color:#0b3658!important;box-shadow:0 10px 24px rgba(0,0,0,.18)!important}\n  .render-pro-figure{margin-top:2px!important;border-radius:16px!important}\n  .render-pro-figure img{display:block!important;width:100%!important;height:auto!important;aspect-ratio:1.08/1!important;object-fit:cover!important;object-position:78% center!important;background:#dcecf5!important}\n  .render-pro-figure figcaption{padding:15px 16px!important}\n  .render-pro-figure figcaption strong{font-size:16px!important;line-height:1.3!important}\n  .render-pro-figure figcaption span{font-size:13px!important;line-height:1.5!important}\n  .price-section{padding-top:54px!important}\n  .price-section h2{font-size:clamp(34px,9.7vw,45px)!important;line-height:1.08!important}\n}\n'''
          p.write_text(css,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'data-build="20260915-1515"' index.html
          grep -q 'assets/render-model-to-reality.webp?v=20260915-1515' index.html
          grep -q 'Mobile refinement 2026-09-15 15:15' landing-stable-20260915.css
          grep -q 'services-pro-grid' index.html
          node --check script.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html landing-stable-20260915.css
          git commit -m "Polish mobile render section" || exit 0
          git push
