name: Published release downloads and plugin API
on:
  push:
    branches: [main]
    paths:
      - 'downloads/**'
      - 'cloudflare-worker/**'
      - '.github/workflows/release-downloads.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact public download bytes
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,time,urllib.request
          root='https://andreagiaquinto.it'
          files=['/downloads/releases.json','/downloads/portfolio/Andrea_Giaquinto_Portfolio.pdf']
          files += [r['file'] for r in json.loads(pathlib.Path('downloads/releases.json').read_text())]
          files += ['/downloads/ag-cad-tools/SHA256_AG_CAD_Tools_2.0.txt']
          for attempt in range(18):
              try:
                  for file in files:
                      request=urllib.request.Request(root+file+'?verify='+str(time.time()),headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=25) as response:
                          actual=hashlib.sha256(response.read()).hexdigest()
                      expected=hashlib.sha256(pathlib.Path(file.lstrip('/')).read_bytes()).hexdigest()
                      assert actual==expected,file
                  print('VERIFIED: exact bytes for',len(files),'public files.')
                  break
              except Exception as error:
                  print('Waiting for release:',str(error),flush=True)
                  if attempt==17: raise
                  time.sleep(15)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for the public website client
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Read plugin APIs through the actual browser client
        run: |
          node - <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{const browser=await chromium.launch();try{
            const page=await browser.newPage();
            await page.route('**/*',route=>['GET','HEAD','OPTIONS'].includes(route.request().method())?route.continue():route.abort());
            await page.goto('https://andreagiaquinto.it/blockhub-cad/',{waitUntil:'networkidle'});
            for(const project of ['yqarch','express-tools','blockhub-cad']){
              const result=await page.evaluate(async project=>{
                const r=await fetch('https://cad-bim-preventivi.andrea-giaqui.workers.dev/api/plugin-comments?project='+project,{credentials:'omit'});
                return {status:r.status,ok:(await r.json()).ok};
              },project);
              assert.equal(result.status,200,project);assert.equal(result.ok,true,project);
              console.log('PUBLIC API VERIFIED',project);
            }
          }finally{await browser.close();}})().catch(error=>{console.error(error);process.exitCode=1});
          JS
