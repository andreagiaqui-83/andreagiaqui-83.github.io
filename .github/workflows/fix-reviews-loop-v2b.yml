name: Fix reviews loop v2b

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-reviews-loop-v2b.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix_loop_v2.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix continuous reviews loop and refresh script cache"
            git push
          fi
