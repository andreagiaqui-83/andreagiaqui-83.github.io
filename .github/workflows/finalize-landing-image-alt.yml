name: Final landing image alternatives
on:
  push:
    branches: [revisione-landing-20260930]
    paths: ['.github/workflows/finalize-landing-image-alt.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revisione-landing-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Change only the two social image descriptions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          for old in ['Visualizzazione illustrativa di architettura contemporanea, servizi CAD BIM e render di Andrea Giaquinto','Visualizzazione architettonica illustrativa dei servizi CAD/BIM e render']:
            assert s.count(old)==1,old
            s=s.replace(old,'Render architettonico di una casa contemporanea con giardino e vetrate')
          assert 'illustrativa' not in s
          p.write_text(s)
          PY
          npm ci --no-audit --no-fund
          npm test
      - name: Commit verified descriptions and remove this one-time helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/finalize-landing-image-alt.yml
          git add index.html .github/workflows/finalize-landing-image-alt.yml
          git commit -m 'Use descriptive social image alternatives; preserve all prices and page functionality'
          git push origin HEAD:revisione-landing-20260930
          git rev-parse HEAD
