name: Normalize YQArch 3.73 public guide and report
on:
  push:
    branches: ["publish-yqarch-3.73"]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply shared navigation and footer
        run: |
          set -euo pipefail
          node scripts/sync-page-navigation.cjs
          node scripts/sync-site-footer.cjs
          git diff --name-only > /tmp/changed.txt
          cat /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/changed.txt').read_text().splitlines())
          expected={
            'downloads/yqarch/YQArch_Italiano_3.73_GUIDA.html',
            'downloads/yqarch/YQArch_Italiano_3.73_REPORT.html',
          }
          if changed != expected:
              raise SystemExit(f'Unexpected normalization changes: {sorted(changed)}')
          PY
      - name: Commit normalized public documents
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/yqarch/YQArch_Italiano_3.73_GUIDA.html downloads/yqarch/YQArch_Italiano_3.73_REPORT.html
          git commit -m "Normalize YQArch 3.73 public documentation [skip ci]"
          git push origin HEAD:publish-yqarch-3.73
