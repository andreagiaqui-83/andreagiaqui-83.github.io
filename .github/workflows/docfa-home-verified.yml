name: DOCFA and Home navigation verification
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'lezioni-autocad/**'
      - 'yqarch-italiano/**'
      - 'express-tools-italiano/**'
      - 'cloudflare-worker/**'
      - 'scripts/**'
      - '.github/scripts/publication_http.py'
      - '.github/workflows/docfa-home-verified.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docfa-home-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium firefox webkit
      - name: Unit, backend and privacy tests with mocked email
        run: |
          set -o pipefail
          npm test | tee "$RUNNER_TEMP/docfa-home-unit.txt"
      - name: Verify local form and common Home appearance
        run: node scripts/qa-docfa-home.cjs local
      - name: Wait for matching public page builds
        if: github.ref == 'refs/heads/main'
        run: python3 .github/scripts/publication_http.py index.html lezioni-autocad/index.html
      - name: Verify public pages without real writes
        if: github.ref == 'refs/heads/main'
        run: node scripts/qa-docfa-home.cjs live
      - name: Save actual verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docfa-home-verification
          path: |
            ${{ runner.temp }}/docfa-home-proof/
            ${{ runner.temp }}/docfa-home-unit.txt
          retention-days: 14
