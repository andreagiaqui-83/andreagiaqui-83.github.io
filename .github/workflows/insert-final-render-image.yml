name: Insert final render image
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/insert-final-render-image.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and install final render visual
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          payload = Path('assets/render-hero-final-20260915.webp.base64.txt')
          if not payload.exists():
              raise SystemExit('Missing staged image payload')
          raw = base64.b64decode(payload.read_text(encoding='utf-8').strip(), validate=True)
          out = Path('assets/render-hero-final-20260915.webp')
          out.write_bytes(raw)
          if len(raw) < 20000:
              raise SystemExit('Decoded image is unexpectedly small')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'data-build="[^"]+"', 'data-build="20260915-1445"', s, count=1)
          s = re.sub(r'landing-stable-20260915\.css\?v=[^"]+', 'landing-stable-20260915.css?v=20260915-1445', s, count=1)
          p.write_text(s, encoding='utf-8')

          css_path = Path('landing-stable-20260915.css')
          css = css_path.read_text(encoding='utf-8')
          marker='/* FINAL GENERATED RENDER VISUAL 2026-09-15 14:45 */'
          if marker not in css:
              css += '''\n\n/* FINAL GENERATED RENDER VISUAL 2026-09-15 14:45 */\n.render-pro-figure{position:relative!important}\n.render-pro-figure::before{content:"";display:block!important;width:100%!important;aspect-ratio:720/405!important;background:url("assets/render-hero-final-20260915.webp?v=20260915-1445") center center/cover no-repeat!important}\n.render-pro-figure>img{display:none!important}\n@media(max-width:640px){.render-pro-figure::before{aspect-ratio:720/405!important;background-position:center center!important}}\n'''
          css_path.write_text(css, encoding='utf-8')
          PY
          rm -f assets/render-hero-final-20260915.webp.base64.txt
      - name: Validate
        run: |
          test -s assets/render-hero-final-20260915.webp
          test ! -e assets/render-hero-final-20260915.webp.base64.txt
          grep -q 'render-hero-final-20260915.webp' landing-stable-20260915.css
          grep -q 'data-build="20260915-1445"' index.html
          python - <<'PY'
          from pathlib import Path
          b=Path('assets/render-hero-final-20260915.webp').read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP'
          print('WEBP OK', len(b), 'bytes')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html landing-stable-20260915.css assets/render-hero-final-20260915.webp
          git rm --cached assets/render-hero-final-20260915.webp.base64.txt 2>/dev/null || true
          git add -u
          git commit -m "Publish final generated render image" || exit 0
          git push
