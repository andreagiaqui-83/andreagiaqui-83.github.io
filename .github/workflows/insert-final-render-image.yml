name: Insert final render image
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/insert-final-render-image.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and install final render visual
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re

          parts_dir = Path('assets/render-final-parts')
          parts = sorted(parts_dir.glob('part*.txt'))
          if len(parts) != 7:
              raise SystemExit(f'Expected 7 image parts, found {len(parts)}')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = '07126a9eccb3cf7f0273c865366820600801f01a367259f359f3d2e5b4d849a0'
          if digest != expected:
              raise SystemExit(f'Unexpected image SHA256: {digest}')
          if len(raw) != 38602 or raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('Invalid final WebP payload')
          out = Path('assets/render-hero-final-20260915.webp')
          out.write_bytes(raw)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'data-build="[^"]+"', 'data-build="20260915-1455"', s, count=1)
          s = re.sub(r'landing-stable-20260915\.css\?v=[^"]+', 'landing-stable-20260915.css?v=20260915-1455', s, count=1)
          s = re.sub(
              r'<img src="assets/render-visual-professionale\.svg\?v=[^"]+" width="1200" height="675" loading="lazy" decoding="async" alt="[^"]*">',
              '<img src="assets/render-hero-final-20260915.webp?v=20260915-1455" width="720" height="405" loading="lazy" decoding="async" alt="Dal rilievo e dal modello tecnico CAD/BIM al render architettonico fotorealistico di un fabbricato">',
              s,
              count=1
          )
          if 'assets/render-hero-final-20260915.webp?v=20260915-1455' not in s:
              raise SystemExit('Final render image reference was not installed in index.html')
          p.write_text(s, encoding='utf-8')

          css_path = Path('landing-stable-20260915.css')
          css = css_path.read_text(encoding='utf-8')
          css = re.sub(r'/\* FINAL GENERATED RENDER VISUAL 2026-09-15 14:45 \*/.*?@media\(max-width:640px\)\{\.render-pro-figure::before\{.*?\}\}\n?', '', css, flags=re.S)
          css += '''\n\n/* FINAL RENDER VISUAL 2026-09-15 14:55 */\n.render-pro-figure>img{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;aspect-ratio:16/9!important;object-fit:cover!important;object-position:center!important;background:#e8f3f9!important;visibility:visible!important;opacity:1!important}\n'''
          css_path.write_text(css, encoding='utf-8')
          PY
          rm -f assets/render-hero-final-20260915.webp.base64.txt
          rm -rf assets/render-final-parts assets/render-parts
      - name: Validate final landing source
        run: |
          test -s assets/render-hero-final-20260915.webp
          test ! -e assets/render-hero-final-20260915.webp.base64.txt
          test ! -e assets/render-final-parts
          test ! -e assets/render-parts
          grep -q 'data-build="20260915-1455"' index.html
          grep -q 'landing-stable-20260915.css?v=20260915-1455' index.html
          grep -q 'assets/render-hero-final-20260915.webp?v=20260915-1455' index.html
          grep -q 'services-pro-grid' index.html
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' landing-stable-20260915.css
          node --check script.js
          python - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('assets/render-hero-final-20260915.webp').read_bytes()
          assert len(b)==38602
          assert hashlib.sha256(b).hexdigest()=='07126a9eccb3cf7f0273c865366820600801f01a367259f359f3d2e5b4d849a0'
          print('Final WebP verified:', len(b), 'bytes')
          PY
      - name: Commit final production source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Publish final generated render visual" || exit 0
          git push
# All 7 image parts are staged; this commit intentionally triggers the production assembly.
