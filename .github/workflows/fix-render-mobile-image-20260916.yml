name: Publish new render marketing visual
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-render-mobile-image-20260916.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and install new marketing render
        shell: bash
        run: |
          set -euo pipefail
          build='20260916-0110'
          dst='assets/render-hero-marketing-20260916.jpg'
          curl -L --fail --retry 2 'https://drive.usercontent.google.com/download?id=1RhHyLnhYCnDjWrBthVI-A8UcJCCWIpGK&export=download&confirm=t' -o "$dst"
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          build='20260916-0110'
          dst=Path('assets/render-hero-marketing-20260916.jpg')
          with Image.open(dst) as im:
              assert im.format == 'JPEG'
              w,h=im.size
              assert w >= 1000 and h >= 500
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'assets/render-[^\"\']+\?v=[^\"\']+', f'assets/render-hero-marketing-20260916.jpg?v={build}', s, count=1)
          if n != 1: raise SystemExit(f'Expected one render image reference, found {n}')
          s=re.sub(r'(<figure class="render-visual"[^>]*><img [^>]*?)width="\d+" height="\d+"', rf'\1width="{w}" height="{h}"', s, count=1)
          s=re.sub(r'data-build="[^"]+"', f'data-build="{build}"', s, count=1)
          p.write_text(s,encoding='utf-8')
          css=Path('render-image-mobile-fix-20260916.css')
          css.write_text('''/* MARKETING RENDER VISUAL - DESKTOP + MOBILE */\n.render-visual{background:#0e2f49!important;min-height:0!important;overflow:hidden!important}\n.render-visual img{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;min-height:0!important;aspect-ratio:16/9!important;object-fit:cover!important;object-position:center!important;visibility:visible!important;opacity:1!important}\n@media(max-width:767px){.render-pro-layout{grid-template-columns:1fr!important}.render-copy,.render-visual{grid-column:1!important}.render-visual{width:100%!important;height:auto!important;margin:0!important;border-radius:16px!important}.render-visual img{width:100%!important;height:auto!important;aspect-ratio:16/9!important;object-fit:cover!important}}\n''',encoding='utf-8')
          PY
      - name: Validate
        run: |
          test -s assets/render-hero-marketing-20260916.jpg
          grep -q 'render-hero-marketing-20260916.jpg?v=20260916-0110' index.html
          grep -q 'data-build="20260916-0110"' index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html assets/render-hero-marketing-20260916.jpg render-image-mobile-fix-20260916.css
          git commit -m "Publish new render marketing visual" || exit 0
          git push
