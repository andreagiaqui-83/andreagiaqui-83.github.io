name: Verify GA4 on live domain
on:
  push:
    branches: ['ga4-activation-20260917']
    paths: ['.github/workflows/ga4-live-verification.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for exact verified files on the live domain
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen, Request
          import hashlib,json,time
          out=Path('ga4-results');out.mkdir(exist_ok=True)
          expected={
            '/assets/measurement-config.js?v=ga4-20260917':'2bb78a0c2ef8c49a90601494229ac2de28c6f91fd281f17d7d9e7419cfb7d955',
            '/':'3777d89142218285b4e4615145ab172c844fd1dc107f6d29297591f160fcd22a',
            '/lezioni-autocad/':'a1212a56be58be4690415d3bc1572099416df13eb36b7adccdbca10bf5018f47',
            '/privacy/':'020a5a374405b865d74fc05aaed4c2b327fc53c3b1d1e1251ca74e885315c03b'
          }
          checks={}
          for path,sha in expected.items():
              for attempt in range(24):
                  try:
                      with urlopen(Request('https://andreagiaquinto.it'+path,headers={'Cache-Control':'no-cache'}),timeout=15) as r:raw=r.read()
                      if hashlib.sha256(raw).hexdigest()==sha:
                          checks[path]={'match':True,'sha256':sha};break
                  except Exception as e:print(type(e).__name__)
                  time.sleep(5)
              else:raise SystemExit('Deployed bytes differ for '+path)
          (out/'deployed-files.json').write_text(json.dumps(checks,indent=2))
          print('LIVE_FILES_MATCH '+json.dumps(checks))
          PY
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Consent tests and one real labelled page_view (no real form writes)
        env:
          GA4_TEST_LIVE: '1'
        run: python .github/scripts/test_ga4_activation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga4-live-verification
          path: ga4-results/
          retention-days: 14
          if-no-files-found: error
