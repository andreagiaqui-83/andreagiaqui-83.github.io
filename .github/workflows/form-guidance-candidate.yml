name: Guided form candidate verification
on:
  push:
    branches: [revisione-modulo-20260930]
    paths:
      - '.github/workflows/form-guidance-candidate.yml'
      - '.github/scripts/form-guidance-build.py'
      - 'scripts/test-form-guidance.mjs'
      - 'scripts/qa-form-guidance.cjs'
permissions:
  contents: write
concurrency:
  group: guided-form-candidate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependencies
        id: dependencies
        run: |
          python -m pip install beautifulsoup4 pillow requests playwright==1.58.0
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium firefox webkit
      - name: Apply reviewed changes on isolated candidate only
        id: apply
        run: |
          test "$GITHUB_REF" = refs/heads/revisione-modulo-20260930
          git diff --exit-code d7fd076a3f88e74bd5a27f277f60c1e95ffddcc0 HEAD -- index.html assets/services/services.js assets/services/services.css lezioni-autocad/index.html lezioni-autocad/assets/landing.css cloudflare-worker/src/index.js AGENTS.md lezioni-autocad/AGENTS.md .github/SERVICES-PUBLICATION.md .github/services-publication.json .github/scripts/services_qa.py .github/scripts/site_consistency_qa.cjs .github/workflows/plugins-verified.yml
          python .github/scripts/form-guidance-build.py
          node --check assets/services/services.js
          node --check cloudflare-worker/src/index.js
          node --check scripts/test-form-guidance.mjs
          node --check scripts/qa-form-guidance.cjs
          node scripts/sync-page-navigation.cjs --check
          node scripts/sync-site-footer.cjs --check
          git diff --check
          git rm .github/scripts/form-guidance-build.py .github/workflows/form-guidance-candidate.yml
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement conditional CAD, BIM, render, mechanical and custom requests; add review and Home navigation'
          git archive --format=zip HEAD -o "$RUNNER_TEMP/guided-form-source.zip"
          git rev-parse HEAD | tee "$RUNNER_TEMP/guided-form-commit.txt"
      - name: Full unit, backend and privacy regression
        if: always() && steps.apply.outcome == 'success'
        run: |
          set -o pipefail
          npm test | tee "$RUNNER_TEMP/guided-form-unit.txt"
      - name: Guided requests and links in three browsers
        if: always() && steps.apply.outcome == 'success'
        run: node scripts/qa-form-guidance.cjs local
      - name: Existing plugin, common-site and navigation regression
        if: always() && steps.apply.outcome == 'success'
        run: |
          node .github/scripts/plugins_qa.cjs local
          node .github/scripts/site_consistency_qa.cjs local
          node scripts/qa-landing-20260930.cjs local
      - name: Existing services regression
        if: always() && steps.apply.outcome == 'success'
        run: python .github/scripts/services_qa.py local
      - name: Save passing candidate on its branch, never main
        if: success()
        run: git push origin HEAD:revisione-modulo-20260930
      - name: Save actual test and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-form-proof
          path: |
            ${{ runner.temp }}/guided-form-source.zip
            ${{ runner.temp }}/guided-form-commit.txt
            ${{ runner.temp }}/guided-form-unit.txt
            ${{ runner.temp }}/form-guidance-proof/
            ${{ runner.temp }}/plugins-proof/
            ${{ runner.temp }}/landing-proof/
            ${{ runner.temp }}/services-restored-proof/
          retention-days: 14
