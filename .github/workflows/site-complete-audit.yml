name: Complete site audit
on:
  push:
    branches: [main, 'release/yqarch-*', 'release/site-*']
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'scripts/audit-site.cjs'
      - 'scripts/qa-edge-telemetry.cjs'
      - 'scripts/test-edge-telemetry.cjs'
      - 'scripts/check-mobile-menu.cjs'
      - 'scripts/qa-preventivo-flow.cjs'
      - 'scripts/test-public-integrity.cjs'
      - 'scripts/site-pages.json'
      - '.github/scripts/publication_http.py'
      - '.github/scripts/test_publication_http.py'
      - '.github/workflows/site-complete-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: complete-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.58.2
      - name: Complete local audit without external writes
        env:
          QA_ENGINES: ${{ matrix.engine }}
        run: node scripts/audit-site.cjs local
      - name: Confirm quote uploads, retries and consent without sending real requests
        env:
          QA_ENGINES: ${{ matrix.engine }}
        run: node scripts/qa-preventivo-flow.cjs local
      - name: Wait for exact published documents
        if: github.ref == 'refs/heads/main'
        run: |
          python3 .github/scripts/test_publication_http.py
          python3 .github/scripts/publication_http.py --all
      - name: Complete live audit without external writes
        if: github.ref == 'refs/heads/main'
        env:
          QA_ENGINES: ${{ matrix.engine }}
        run: node scripts/audit-site.cjs live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-site-${{ matrix.engine }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/site-audit/
            ${{ runner.temp }}/quote-flow-proof/
          retention-days: 30
