name: Enable GitHub Pages HTTPS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-pages-https.yml'
permissions:
  contents: read
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Request HTTPS enforcement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          code=$(curl -sS -o response.json -w '%{http_code}' -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"cname":"andreagiaquinto.it","https_enforced":true}')
          echo "HTTP $code"
          cat response.json
          echo
          echo '=== current pages status ==='
          curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${{ github.repository }}/pages
          exit 0
