name: Apply Preventivo Online publication
# retry 5

on:
  push:
    branches:
      - publish-preventivo-online-20261004

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Decode migration
        run: base64 -d scripts/apply-preventivo-20261004.cjs.b64 > scripts/apply-preventivo-20261004.cjs
      - name: Apply requested site changes
        run: node scripts/apply-preventivo-20261004.cjs
      - name: Sync shared navigation
        run: |
          node scripts/sync-site-footer.cjs
          node scripts/sync-site-header.cjs
          node scripts/sync-page-navigation.cjs
      - name: Verify synchronized surfaces
        run: |
          node scripts/sync-site-footer.cjs --check
          node scripts/sync-site-header.cjs --check
          node scripts/sync-page-navigation.cjs --check
          node scripts/test-site-navigation.cjs
      - name: Run repository tests
        run: npm test
      - name: Remove temporary migration files
        run: |
          rm -f scripts/apply-preventivo-20261004.cjs scripts/apply-preventivo-20261004.cjs.b64
          rm -f scripts/.tmp-ribbon-20261004.b64 scripts/.tmp-portrait-20261004.b64
          rm -f .github/workflows/apply-preventivo-20261004.yml
      - name: Commit generated publication update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: publish Preventivo online and refresh site"
            git push
          fi
