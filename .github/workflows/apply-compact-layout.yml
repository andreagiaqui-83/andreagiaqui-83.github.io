name: Apply compact landing layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-compact-layout.yml'
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire compact layout into production page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          link='<link rel="stylesheet" href="compact-layout-20260915.css?v=20260915-1730">'
          s=re.sub(r'<link rel="stylesheet" href="compact-layout-20260915\.css\?v=[^"]+">','',s)
          s=s.replace('</head>',link+'</head>',1)
          s=re.sub(r'data-build="[^"]+"','data-build="20260915-1730"',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate layout source
        run: |
          test -s compact-layout-20260915.css
          grep -q 'compact-layout-20260915.css?v=20260915-1730' index.html
          grep -q 'data-build="20260915-1730"' index.html
          grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' compact-layout-20260915.css
          grep -q '.hero{display:grid' compact-layout-20260915.css
          grep -q '.visual-showcase>.wrap{display:grid' compact-layout-20260915.css
          grep -q '.material-guide{grid-template-columns:repeat(3' compact-layout-20260915.css
          grep -q 'id="quoteForm"' index.html
          grep -q 'id="recensioni"' index.html
          grep -q 'render-final-pc-20260915.jpg' index.html
      - name: Commit compact production page
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Activate compact professional landing layout" || exit 0
          git push
      - name: Wait for Pages and verify live custom domain
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://andreagiaquinto.it/'
          CSS='https://andreagiaquinto.it/compact-layout-20260915.css?v=20260915-1730'
          ok=0
          for i in {1..14}; do
            echo "Live compact-layout verification attempt $i"
            html=$(curl -fsSL --connect-timeout 10 --max-time 25 "${ROOT}?verify=compact-20260915-1730-${i}" || true)
            if echo "$html" | grep -q 'compact-layout-20260915.css?v=20260915-1730' && echo "$html" | grep -q 'data-build="20260915-1730"'; then
              if curl -fsSL --connect-timeout 10 --max-time 25 "$CSS" -o /tmp/compact.css; then
                ok=1
                break
              fi
            fi
            sleep 15
          done
          test "$ok" = 1
          grep -q 'Compact professional layout' /tmp/compact.css
          grep -q '#quoteForm{display:grid' /tmp/compact.css
          grep -q '.visual-showcase>.wrap{display:grid' /tmp/compact.css
          grep -q '.reviews-section{padding:48px 0 30px' /tmp/compact.css
          echo 'LIVE COMPACT LANDING VERIFIED'
