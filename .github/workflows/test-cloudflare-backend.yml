name: Test Cloudflare quote backend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - 'scripts/test-*.mjs'
      - '.github/workflows/test-cloudflare-backend.yml'
permissions:
  contents: read
jobs:
  simulated-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Backend and security tests with simulated storage and email
        run: node --test scripts/test-*.mjs
      - name: Read-only public health check
        run: |
          curl --fail --silent --show-error --max-time 20 https://cad-bim-preventivi.andrea-giaqui.workers.dev/health > health.json
          node -e "if(JSON.parse(require('fs').readFileSync('health.json')).ok!==true)process.exit(1)"
