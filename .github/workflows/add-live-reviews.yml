name: Add live reviews carousel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-live-reviews.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update landing and backend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('In questa sezione vengono raccolti brevi commenti e recensioni reali dei clienti sui lavori AutoCAD, Revit/BIM e di disegno tecnico svolti.', 'Commenti reali dei clienti sui lavori AutoCAD, Revit/BIM e di disegno tecnico. Le recensioni scorrono automaticamente e puoi pubblicare anche la tua.')
          if 'id="reviewsCarousel"' not in s:
              s = s.replace('<div class="reviews-grid" aria-live="polite">', '<div class="reviews-carousel" id="reviewsCarousel" tabindex="0" aria-label="Recensioni clienti"><div class="reviews-grid" id="reviewsGrid" aria-live="polite">', 1)
              last = '<article class="review-card"><div class="review-mark" aria-hidden="true">“</div><p>Ricostruzione oggetto 3D in AutoCAD ottimo. Rapido ed economico. Super consigliato!</p><span>Massimo V. · AutoCAD 3D</span></article>\n          </div>'
              s = s.replace(last, last[:-6] + '</div></div>')
          if 'id="reviewForm"' not in s:
              start = s.find('<section id="recensioni"')
              end = s.find('</section>', start)
              if start != -1 and end != -1:
                  end += len('</section>')
                  form = '''<section class="review-submit-section"><div class="wrap"><div class="review-submit-card"><div><p class="eyebrow">LA TUA ESPERIENZA</p><h3>Lascia una recensione</h3><p>Inserisci nome e cognome: sul sito verranno mostrati soltanto il nome e l’iniziale del cognome, ad esempio <strong>Mario R.</strong></p></div><form id="reviewForm" class="review-form"><input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true"><div class="grid-2"><label>Nome e cognome<input type="text" name="name" maxlength="80" required autocomplete="name" placeholder="Mario Rossi"></label><label>Tipo di lavoro <span class="optional">facoltativo</span><input type="text" name="service" maxlength="80" placeholder="AutoCAD 2D, Revit/BIM, disegno meccanico..."></label></div><label>Recensione<textarea name="text" rows="4" minlength="8" maxlength="600" required placeholder="Racconta brevemente la tua esperienza..."></textarea></label><label class="review-consent"><input type="checkbox" name="consent" required><span>Autorizzo la pubblicazione della recensione con il mio nome e la sola iniziale del cognome.</span></label><button class="button primary" type="submit">Pubblica recensione</button><p id="reviewStatus" class="review-status" role="status" aria-live="polite"></p></form></div></div></section>'''
                  s = s[:end] + form + s[end:]
          p.write_text(s, encoding='utf-8')

          p = Path('enhancements.css')
          css = p.read_text(encoding='utf-8')
          if 'Carousel recensioni live' not in css:
              css += '''\n/* Carousel recensioni live */\n.reviews-carousel{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;cursor:grab;padding:4px 0 10px;scroll-behavior:smooth}\n.reviews-carousel::-webkit-scrollbar{display:none}\n.reviews-carousel:active{cursor:grabbing}\n.reviews-carousel .reviews-grid{display:flex;gap:18px;width:max-content;margin-top:26px}\n.reviews-carousel .review-card{flex:0 0 min(360px,82vw);width:min(360px,82vw);min-height:190px}\n.review-submit-section{padding:0 0 70px;background:linear-gradient(180deg,#eef6fc 0%,#fff 100%)}\n.review-submit-card{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(320px,1.2fr);gap:34px;padding:28px;border:1px solid #d7e2ec;border-radius:18px;background:#fff;box-shadow:0 12px 32px rgba(11,58,91,.07)}\n.review-submit-card h3{margin:5px 0 8px;font-size:27px;color:#0b2a46}\n.review-submit-card p{color:#587086;line-height:1.55}\n.review-form{display:grid;gap:15px}.review-form label{display:grid;gap:7px;font-weight:800;color:#17344e}.review-form input[type="text"],.review-form textarea{width:100%;box-sizing:border-box}\n.review-consent{grid-template-columns:auto 1fr!important;align-items:start;gap:10px!important;font-weight:500!important;font-size:14px;line-height:1.45}.review-consent input{margin-top:3px}\n.review-status{min-height:1.3em;margin:0!important;font-size:14px;font-weight:700}.review-status.is-success{color:#17653b}.review-status.is-error{color:#a52929}\n@media(max-width:850px){.review-submit-card{grid-template-columns:1fr}.reviews-carousel .review-card{flex-basis:min(340px,86vw);width:min(340px,86vw)}}\n@media(max-width:576px){.review-submit-card{padding:20px 16px;border-radius:14px}.review-submit-card h3{font-size:23px}.review-submit-section{padding-bottom:45px}}\n@media(prefers-reduced-motion:reduce){.reviews-carousel{scroll-behavior:auto}}\n'''
          p.write_text(css, encoding='utf-8')

          p = Path('script.js')
          js = p.read_text(encoding='utf-8')
          if 'const reviewsCarousel = document.getElementById' not in js:
              addon = '''\n\n  const reviewsCarousel = document.getElementById('reviewsCarousel');\n  const reviewsGrid = document.getElementById('reviewsGrid');\n  const reviewForm = document.getElementById('reviewForm');\n  const reviewStatus = document.getElementById('reviewStatus');\n  const createReviewCard = review => {\n    const article = document.createElement('article'); article.className = 'review-card';\n    const mark = document.createElement('div'); mark.className = 'review-mark'; mark.setAttribute('aria-hidden','true'); mark.textContent = '“';\n    const text = document.createElement('p'); text.textContent = review.text || '';\n    const meta = document.createElement('span'); meta.textContent = [review.displayName || 'Cliente', review.service || 'Recensione cliente'].filter(Boolean).join(' · ');\n    article.append(mark,text,meta); return article;\n  };\n  const loadLiveReviews = async () => {\n    if (!reviewsGrid) return;\n    try { const r = await fetch(`${backendBase}/api/reviews`); if (!r.ok) return; const d = await r.json(); (d.reviews || []).slice().reverse().forEach(x => reviewsGrid.appendChild(createReviewCard(x))); } catch (_) {}\n  };\n  if (reviewForm) reviewForm.addEventListener('submit', async event => {\n    event.preventDefault(); const button = reviewForm.querySelector('button[type="submit"]'); const fd = new FormData(reviewForm);\n    const payload = {name:String(fd.get('name')||'').trim(),service:String(fd.get('service')||'').trim(),text:String(fd.get('text')||'').trim(),website:String(fd.get('website')||'').trim()};\n    if (reviewStatus) { reviewStatus.textContent='Pubblicazione in corso…'; reviewStatus.className='review-status'; } if (button) button.disabled=true;\n    try { const r=await fetch(`${backendBase}/api/reviews`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); const d=await r.json().catch(()=>({})); if(!r.ok||!d.ok) throw new Error(d.error||'Invio non riuscito.'); if(d.review) reviewsGrid?.prepend(createReviewCard(d.review)); reviewForm.reset(); if(reviewStatus){reviewStatus.textContent=`Grazie! La recensione è stata pubblicata come ${d.review.displayName}.`;reviewStatus.className='review-status is-success';} }\n    catch(error){if(reviewStatus){reviewStatus.textContent=error.message||'Non è stato possibile pubblicare la recensione.';reviewStatus.className='review-status is-error';}} finally{if(button)button.disabled=false;}\n  });\n  let reviewAutoTimer=null; const stopReviewAutoScroll=()=>{if(reviewAutoTimer){clearInterval(reviewAutoTimer);reviewAutoTimer=null;}};\n  const startReviewAutoScroll=()=>{if(!reviewsCarousel||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;stopReviewAutoScroll();reviewAutoTimer=setInterval(()=>{const max=reviewsCarousel.scrollWidth-reviewsCarousel.clientWidth;if(max<=4)return;if(reviewsCarousel.scrollLeft>=max-2)reviewsCarousel.scrollTo({left:0,behavior:'smooth'});else reviewsCarousel.scrollBy({left:1,behavior:'auto'});},28);};\n  if(reviewsCarousel){reviewsCarousel.addEventListener('mouseenter',stopReviewAutoScroll);reviewsCarousel.addEventListener('mouseleave',startReviewAutoScroll);reviewsCarousel.addEventListener('touchstart',stopReviewAutoScroll,{passive:true});reviewsCarousel.addEventListener('touchend',()=>setTimeout(startReviewAutoScroll,1400),{passive:true});reviewsCarousel.addEventListener('focusin',stopReviewAutoScroll);reviewsCarousel.addEventListener('focusout',startReviewAutoScroll);}\n  loadLiveReviews().finally(startReviewAutoScroll);\n'''
              pos = js.rfind('})();')
              js = js[:pos] + addon + '\n' + js[pos:]
          p.write_text(js, encoding='utf-8')

          p = Path('cloudflare-worker/src/index.js')
          w = p.read_text(encoding='utf-8')
          if 'async function submitReview' not in w:
              funcs = '''\n\nfunction publicReviewName(fullName = '') {\n  const parts = String(fullName).trim().replace(/\\s+/g, ' ').split(' ').filter(Boolean);\n  if (parts.length < 2) return '';\n  const first = parts[0].slice(0, 40);\n  const initial = parts[parts.length - 1].charAt(0).toUpperCase();\n  return `${first} ${initial}.`;\n}\nfunction cleanReviewText(value = '', max = 600) { return String(value).replace(/\\s+/g, ' ').trim().slice(0, max); }\nasync function reviewRateLimited(request, env) {\n  const ip = request.headers.get('CF-Connecting-IP') || 'unknown'; const hour = new Date().toISOString().slice(0, 13); const hash = await hmac(env.SIGNING_SECRET, `review-rate|${ip}`); const prefix = `review-rate/${hash}/${hour}/`; const list = await env.QUOTE_FILES.list({prefix,limit:4});\n  if ((list.objects || []).length >= 3) return true; await env.QUOTE_FILES.put(`${prefix}${crypto.randomUUID()}`, '1'); return false;\n}\nasync function listReviews(_request, env, origin) {\n  const listed = await env.QUOTE_FILES.list({prefix:'reviews/',limit:100}); const keys=(listed.objects||[]).map(o=>o.key).sort().slice(-50); const reviews=[];\n  for(const key of keys){const obj=await env.QUOTE_FILES.get(key);if(!obj)continue;const review=await obj.json().catch(()=>null);if(review?.displayName&&review?.text)reviews.push(review);}\n  reviews.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))); return json({ok:true,reviews},200,origin,env);\n}\nasync function submitReview(request, env, origin) {\n  const body=await request.json().catch(()=>null); if(!body)return json({ok:false,error:'Recensione non valida.'},400,origin,env); if(String(body.website||'').trim())return json({ok:true,review:null},200,origin,env);\n  const displayName=publicReviewName(body.name); const text=cleanReviewText(body.text,600); const service=cleanReviewText(body.service,80);\n  if(!displayName)return json({ok:false,error:'Inserisci nome e cognome.'},400,origin,env); if(text.length<8)return json({ok:false,error:'Scrivi una recensione un po’ più completa.'},400,origin,env); if(/https?:\\/\\//i.test(text))return json({ok:false,error:'Non inserire link nella recensione.'},400,origin,env); if(await reviewRateLimited(request,env))return json({ok:false,error:'Hai inviato troppe recensioni in poco tempo. Riprova più tardi.'},429,origin,env);\n  const review={id:crypto.randomUUID(),displayName,service,text,createdAt:new Date().toISOString()}; const key=`reviews/${review.createdAt.replace(/[:.]/g,'-')}-${review.id}.json`; await env.QUOTE_FILES.put(key,JSON.stringify(review),{httpMetadata:{contentType:'application/json'}});\n  if(env.RESEND_API_KEY&&env.EMAIL_TO){try{await sendEmail(env,{from:env.EMAIL_FROM||'Preventivi CAD BIM <onboarding@resend.dev>',to:[env.EMAIL_TO],subject:`Nuova recensione da ${displayName}`,html:`<div style="font-family:Arial,sans-serif"><h2>Nuova recensione pubblicata</h2><p><strong>${escapeHtml(displayName)}</strong>${service?` · ${escapeHtml(service)}`:''}</p><p>${escapeHtml(text)}</p></div>`});}catch(_){}}\n  return json({ok:true,review},200,origin,env);\n}\n'''
              w = w.replace('export default {', funcs + '\nexport default {', 1)
          route = "if (url.pathname === '/api/submit' && request.method === 'POST') return submitQuote(request, env, origin);"
          if "'/api/reviews'" not in w:
              w = w.replace(route, route + "\n    if (url.pathname === '/api/reviews' && request.method === 'GET') return listReviews(request, env, origin);\n    if (url.pathname === '/api/reviews' && request.method === 'POST') return submitReview(request, env, origin);", 1)
          p.write_text(w, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html enhancements.css script.js cloudflare-worker/src/index.js
          if ! git diff --cached --quiet; then
            git commit -m "Add scrolling live customer reviews"
            git push
          fi