name: Refresh review carousel assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-review-arrows.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('reviews-fixed.css?v=20260914-2','reviews-fixed.css?v=20260914-3')
          s=s.replace('reviews-fixed.js?v=20260914-2','reviews-fixed.js?v=20260914-3')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Refresh review carousel assets" || exit 0
          git push
