name: Diagnose custom domain HTTPS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-domain.yml'
permissions:
  contents: read
  pages: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: DNS records
        run: |
          echo '=== A ==='
          dig +short A andreagiaquinto.it
          echo '=== AAAA ==='
          dig +short AAAA andreagiaquinto.it
          echo '=== CNAME www ==='
          dig +short CNAME www.andreagiaquinto.it
      - name: HTTPS certificate
        run: |
          echo | openssl s_client -connect andreagiaquinto.it:443 -servername andreagiaquinto.it 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
          curl -IvsS --max-time 20 https://andreagiaquinto.it/ 2>&1 | tail -n 40 || true
      - name: GitHub Pages status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${{ github.repository }}/pages || true
