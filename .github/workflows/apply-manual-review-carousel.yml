name: Apply manual review carousel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-manual-review-carousel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply manual carousel patch
        run: python .github/manual_review_carousel_patch.py
      - name: Validate JavaScript
        run: node --check script.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js enhancements.css index.html
          if ! git diff --cached --quiet; then
            git commit -m "Replace automatic reviews with manual looping carousel"
            git push
          fi
