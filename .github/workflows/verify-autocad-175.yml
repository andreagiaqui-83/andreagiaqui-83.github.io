name: Verify AutoCAD 17.5 public release
on:
  push:
    paths:
      - '.github/workflows/verify-autocad-175.yml'
      - '.github/scripts/verify_autocad_175.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-autocad-175
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm reviewed baseline is unchanged
        run: git diff --exit-code 40662acfd04fc3b6f58e029e8027a6b45b61ca10 -- index.html lezioni-autocad assets/measurement-config.js assets/measurement.js privacy cloudflare-worker
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Run isolated frontend and backend tests (no real email)
        run: |
          mkdir -p qa-results
          npm ci --ignore-scripts
          set -o pipefail
          npm test | tee qa-results/unit-tests.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Public page checks at thirteen widths (GET only)
        run: python .github/scripts/verify_autocad_175.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autocad-17-5-public-verification
          path: qa-results/
          if-no-files-found: error
          retention-days: 14
