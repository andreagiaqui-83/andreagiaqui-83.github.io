name: Apply review moderation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-review-moderation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply moderation patch
        run: python .github/moderate_reviews_patch.py
      - name: Validate JavaScript
        run: |
          node --check script.js
          node --check cloudflare-worker/src/index.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker/src/index.js script.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add premoderation and owner controls for reviews"
            git push
          fi
      # revision 3
