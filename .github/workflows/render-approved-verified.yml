name: Verify approved render and public delivery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-approved-verified.yml'
      - '.github/scripts/render_verified.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: approved-render-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install image and browser validators
        run: |
          python -m pip install --quiet 'Pillow>=11.3,<13' 'playwright>=1.50,<2' requests
          python -m playwright install --with-deps chromium webkit
      - name: Assemble complete approved image and verify checksum
        run: python .github/scripts/render_verified.py prepare
      - name: Test actual image decoding and responsive layout
        run: python .github/scripts/render_verified.py local
      - name: Create fully tested candidate without overwriting main
        id: candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="render-verified-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add index.html assets/render-rilievo-fotorealistico-28cdfe14.jpg assets/render-hero-final-universal.jpg assets/render-hero-marketing-20260916.jpg .github/render-media
          if ! git diff --cached --quiet; then
            git commit -m 'Install complete approved render; checksum and browser tests passed'
          fi
          git push origin "HEAD:refs/heads/$branch"
          echo "CANDIDATE_READY $branch $(git rev-parse HEAD)"
          echo "Candidate: $branch, commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Save pre-publication screenshots
        uses: actions/upload-artifact@v4
        with:
          name: render-local-proof
          path: ${{ runner.temp }}/render-proof/
          retention-days: 7
      - name: Verify real public HTML and JPEG on desktop and mobile
        run: python .github/scripts/render_verified.py live
      - name: Save complete verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-live-proof
          path: ${{ runner.temp }}/render-proof/
          retention-days: 7
