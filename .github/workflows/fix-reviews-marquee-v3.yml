name: Fix reviews marquee v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-reviews-marquee-v3.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply mobile-safe reviews marquee patch
        run: python .github/fix_reviews_v3.py
      - name: Validate JavaScript
        run: node --check script.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js enhancements.css index.html
          if ! git diff --cached --quiet; then
            git commit -m "Replace reviews JS loop with mobile-safe CSS marquee"
            git push
          fi
