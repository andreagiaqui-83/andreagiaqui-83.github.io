name: Migrate site to custom domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/domain-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update site URLs and backend origin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://andreagiaqui-83.github.io/', 'https://andreagiaquinto.it/')
          s = s.replace('https://andreagiaqui-83.github.io', 'https://andreagiaquinto.it')
          s = s.replace('Disegnatore AutoCAD e Modellazione Revit BIM Online | Preventivo Gratuito', 'Disegnatore AutoCAD e Revit BIM Online | Andrea Giaquinto')
          s = s.replace('action="https://formsubmit.co/andrea.giaqui@gmail.com"', 'action=""')
          s = s.replace('Per l’invio tramite questo modulo, gli allegati complessivi devono restare entro 10 MB. Se il materiale supera questo limite, indica nelle note che desideri inviarlo separatamente e sarai ricontattato.', 'Puoi caricare direttamente file fino a 90 MB ciascuno, per un massimo complessivo di 500 MB. Per materiale più grande usa un link cloud.')
          p.write_text(s, encoding='utf-8')

          p = Path('cloudflare-worker/wrangler.toml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('ALLOWED_ORIGIN = "https://andreagiaqui-83.github.io"', 'ALLOWED_ORIGIN = "https://andreagiaquinto.it"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit migration changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cloudflare-worker/wrangler.toml
          if ! git diff --cached --quiet; then
            git commit -m "Migrate landing and backend to andreagiaquinto.it"
            git push
          fi
      - name: Deploy Cloudflare Worker
        working-directory: cloudflare-worker
        run: |
          npm install
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
