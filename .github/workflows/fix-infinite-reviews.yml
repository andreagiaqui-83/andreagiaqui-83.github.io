name: Fix infinite reviews carousel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-infinite-reviews.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make reviews loop seamlessly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          old = """  let reviewAutoTimer=null; const stopReviewAutoScroll=()=>{if(reviewAutoTimer){clearInterval(reviewAutoTimer);reviewAutoTimer=null;}};\n  const startReviewAutoScroll=()=>{if(!reviewsCarousel||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;stopReviewAutoScroll();reviewAutoTimer=setInterval(()=>{const max=reviewsCarousel.scrollWidth-reviewsCarousel.clientWidth;if(max<=4)return;if(reviewsCarousel.scrollLeft>=max-2)reviewsCarousel.scrollTo({left:0,behavior:'smooth'});else reviewsCarousel.scrollBy({left:1,behavior:'auto'});},28);};\n  if(reviewsCarousel){reviewsCarousel.addEventListener('mouseenter',stopReviewAutoScroll);reviewsCarousel.addEventListener('mouseleave',startReviewAutoScroll);reviewsCarousel.addEventListener('touchstart',stopReviewAutoScroll,{passive:true});reviewsCarousel.addEventListener('touchend',()=>setTimeout(startReviewAutoScroll,1400),{passive:true});reviewsCarousel.addEventListener('focusin',stopReviewAutoScroll);reviewsCarousel.addEventListener('focusout',startReviewAutoScroll);}\n  loadLiveReviews().finally(startReviewAutoScroll);\n"""
          new = """  let reviewAutoTimer=null;\n  const stopReviewAutoScroll=()=>{if(reviewAutoTimer){clearInterval(reviewAutoTimer);reviewAutoTimer=null;}};\n  const prepareInfiniteReviews=()=>{\n    if(!reviewsCarousel||!reviewsGrid||reviewsGrid.dataset.loopReady==='1')return;\n    const originals=[...reviewsGrid.children].filter(el=>!el.dataset.reviewClone);\n    if(originals.length<2)return;\n    originals.forEach(card=>{const clone=card.cloneNode(true);clone.dataset.reviewClone='1';clone.setAttribute('aria-hidden','true');clone.setAttribute('tabindex','-1');reviewsGrid.appendChild(clone);});\n    reviewsGrid.dataset.loopReady='1';\n  };\n  const normalizeReviewLoop=()=>{\n    if(!reviewsCarousel||!reviewsGrid||reviewsGrid.dataset.loopReady!=='1')return;\n    const half=reviewsGrid.scrollWidth/2;\n    if(half>0&&reviewsCarousel.scrollLeft>=half)reviewsCarousel.scrollLeft-=half;\n  };\n  const startReviewAutoScroll=()=>{\n    if(!reviewsCarousel||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;\n    prepareInfiniteReviews(); stopReviewAutoScroll();\n    reviewAutoTimer=setInterval(()=>{normalizeReviewLoop();reviewsCarousel.scrollLeft+=1;normalizeReviewLoop();},28);\n  };\n  if(reviewsCarousel){reviewsCarousel.addEventListener('scroll',normalizeReviewLoop,{passive:true});reviewsCarousel.addEventListener('mouseenter',stopReviewAutoScroll);reviewsCarousel.addEventListener('mouseleave',startReviewAutoScroll);reviewsCarousel.addEventListener('touchstart',stopReviewAutoScroll,{passive:true});reviewsCarousel.addEventListener('touchend',()=>setTimeout(startReviewAutoScroll,1400),{passive:true});reviewsCarousel.addEventListener('focusin',stopReviewAutoScroll);reviewsCarousel.addEventListener('focusout',startReviewAutoScroll);}\n  loadLiveReviews().finally(()=>{prepareInfiniteReviews();startReviewAutoScroll();});\n"""
          if old not in s:
              raise SystemExit('Auto-scroll block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          if ! git diff --cached --quiet; then
            git commit -m "Make reviews carousel loop seamlessly"
            git push
          fi
