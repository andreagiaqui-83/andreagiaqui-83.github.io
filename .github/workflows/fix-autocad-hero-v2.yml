name: Fix AutoCAD hero v2

on:
  push:
    paths:
      - '.github/workflows/fix-autocad-hero-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch landing hero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('lezioni-autocad/index.html')
          html = p.read_text(encoding='utf-8')

          banner = '''<div class="hero-promo" aria-label="Lezioni, corsi e ripetizioni AutoCAD 2D e 3D"><div class="hero-promo-photo"><img id="heroPortrait" alt="Andrea Giaquinto, disegnatore AutoCAD certificato Autodesk ACU" hidden><div class="hero-photo-fallback" id="heroPhotoFallback">AG</div><div class="hero-photo-caption"><strong>Andrea Giaquinto</strong><span>Disegnatore AutoCAD certificato Autodesk ACU</span></div></div><div class="hero-promo-copy"><span class="hero-promo-kicker">LEZIONI · CORSI · RIPETIZIONI AUTOCAD</span><h2>AutoCAD 2D e 3D, <span>davvero su misura.</span></h2><p>Impara con esercizi reali, spiegazioni chiare e correzioni in diretta sul tuo schermo. Un percorso personalizzato per scuola, università e lavoro.</p><div class="hero-promo-chips"><span>Online</span><span>30 min gratis</span><span>15 €/ora</span><span>Maturità</span><span>Certificazioni Autodesk</span></div></div><div class="hero-promo-cad"><img src="assets/autocad_dalla_bozza_alla_pianta.webp" alt="Da poche linee a una planimetria completa in AutoCAD"><div class="hero-promo-arrow" aria-hidden="true">→</div><strong>Dalle basi ai tuoi progetti reali</strong></div></div>'''

          html, n = re.subn(r'<div class="hero-wide-banner">.*?</div>', banner, html, count=1, flags=re.S)
          if n == 0:
              html, n = re.subn(r'<div class="lesson-banner".*?</div></div>', banner, html, count=1, flags=re.S)
          if n == 0:
              raise SystemExit('Hero target non trovato')

          css = r'''/* HERO-PROMO-V2 */
          .hero-promo{position:relative;display:grid;grid-template-columns:260px minmax(0,1fr) 380px;gap:28px;align-items:center;margin:20px 0 30px;padding:24px;border:1px solid rgba(105,229,255,.34);border-radius:28px;overflow:hidden;background:radial-gradient(circle at 16% 18%,rgba(105,229,255,.16),transparent 30%),radial-gradient(circle at 86% 28%,rgba(114,134,255,.18),transparent 30%),linear-gradient(135deg,#0c263d,#061523 72%);box-shadow:0 26px 70px rgba(0,0,0,.42)}
          .hero-promo::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(105,229,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(105,229,255,.045) 1px,transparent 1px);background-size:46px 46px}
          .hero-promo>*{position:relative;z-index:1}.hero-promo-photo{position:relative;min-height:390px;border-radius:22px;overflow:hidden;border:1px solid rgba(105,229,255,.26);background:#06111c;box-shadow:0 20px 44px rgba(0,0,0,.32)}
          .hero-promo-photo img{display:block;width:100%;height:100%;min-height:390px;object-fit:cover;object-position:center top}.hero-photo-fallback{display:grid;place-items:center;min-height:390px;font-size:4rem;font-weight:900;color:#69e5ff;background:linear-gradient(160deg,#0f2a40,#06111c)}
          .hero-photo-caption{position:absolute;left:12px;right:12px;bottom:12px;padding:11px 12px;border-radius:13px;background:rgba(5,18,31,.88);backdrop-filter:blur(6px)}.hero-photo-caption strong,.hero-photo-caption span{display:block}.hero-photo-caption span{margin-top:3px;color:#c2d6e3;font-size:.8rem;line-height:1.35}
          .hero-promo-copy{min-width:0}.hero-promo-kicker{display:inline-flex;padding:8px 12px;border-radius:999px;border:1px solid rgba(105,229,255,.28);background:rgba(5,18,31,.5);font-size:.74rem;font-weight:900;letter-spacing:.08em;color:#e3faff}
          .hero-promo-copy h2{margin:15px 0 12px;font-size:clamp(2.1rem,3.5vw,4rem);line-height:.98;letter-spacing:-.055em}.hero-promo-copy h2 span{display:block;color:#69e5ff}.hero-promo-copy p{margin:0;color:#c0d4e1;font-size:1.03rem;line-height:1.65}
          .hero-promo-chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.hero-promo-chips span{padding:8px 11px;border-radius:999px;border:1px solid rgba(105,229,255,.2);background:#0f2a40;color:#effbff;font-size:.82rem;font-weight:800}
          .hero-promo-cad{position:relative;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;border-radius:22px;overflow:hidden;border:1px solid rgba(105,229,255,.22);background:#071421;min-height:390px}.hero-promo-cad img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}.hero-promo-cad::after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(3,14,24,.97))}
          .hero-promo-cad strong{position:relative;z-index:2;padding:18px 18px 16px;font-size:1rem;text-align:center}.hero-promo-arrow{position:absolute;z-index:2;left:18px;top:18px;width:52px;height:52px;display:grid;place-items:center;border-radius:50%;background:#69e5ff;color:#06111e;font-size:1.6rem;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.25)}
          @media(max-width:1100px){.hero-promo{grid-template-columns:220px minmax(0,1fr)}.hero-promo-cad{grid-column:1/-1;min-height:330px}.hero-promo-photo,.hero-promo-photo img,.hero-photo-fallback{min-height:340px}}
          @media(max-width:700px){.hero-promo{grid-template-columns:1fr;padding:15px;gap:16px}.hero-promo-photo{max-width:270px;width:100%;margin-inline:auto}.hero-promo-photo,.hero-promo-photo img,.hero-photo-fallback{min-height:330px}.hero-promo-copy{text-align:center}.hero-promo-kicker{font-size:.68rem}.hero-promo-copy h2{font-size:clamp(2rem,11vw,3.25rem)}.hero-promo-chips{justify-content:center}.hero-promo-cad{min-height:260px}}
          '''
          if 'HERO-PROMO-V2' not in html:
              html = html.replace('</style>', css + '</style>', 1)

          loader = '''<script id="heroPortraitLoader">(async()=>{const img=document.getElementById('heroPortrait'),fallback=document.getElementById('heroPhotoFallback');if(!img)return;try{const r=await fetch('assets/lezioni-autocad.js?v=portrait2',{cache:'no-store'});const t=await r.text();const m=t.match(/const\\s+photoData\\s*=\\s*['\"](data:image\\/webp;base64,[^'\"]+)['\"]/);if(m){img.src=m[1];img.onload=()=>{img.hidden=false;if(fallback)fallback.hidden=true};}}catch(e){}})();</script>'''
          if 'heroPortraitLoader' not in html:
              html = html.replace('</body>', loader + '</body>')

          html = re.sub(r'data-build="[^"]+"', 'data-build="20260916-autocad-v12"', html, count=1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "andreagiaqui-83"
          git config user.email "andrea.giaqui@gmail.com"
          git add lezioni-autocad/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corregge hero AutoCAD con banner unico e foto"
          git push
