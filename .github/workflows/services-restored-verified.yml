name: Services landing regression and live verification
on:
  push:
    branches: [main, 'optimize/services-*']
    paths:
      - 'index.html'
      - 'assets/services/**'
      - 'assets/measurement.js'
      - 'scripts/test-frontend.cjs'
      - 'privacy/index.html'
      - 'cloudflare-worker/src/index.js'
      - 'scripts/test-services-*'
      - '.github/scripts/services_qa.py'
      - '.github/scripts/services_restored_check.py'
      - '.github/workflows/services-restored-verified.yml'
permissions:
  contents: read
concurrency:
  group: services-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --quiet playwright requests beautifulsoup4 pillow
          python -m playwright install --with-deps chromium webkit firefox
      - name: Unit and security regression tests, including protected lessons
        run: node --test scripts/test-frontend.cjs scripts/test-lessons.mjs scripts/test-services-frontend.cjs scripts/test-services-backend.mjs
      - name: Verify candidate in Chromium, WebKit and Firefox
        run: python .github/scripts/services_qa.py local
      - name: Verify public deployment
        if: github.ref == 'refs/heads/main'
        run: python .github/scripts/services_qa.py live
      - name: Save visual and functional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: services-quality-${{ github.sha }}
          path: ${{ runner.temp }}/services-restored-proof/
          retention-days: 30
