name: Force render reflow refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-live-refresh-20260915.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish fresh render layout asset
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          build = '20260915-1815'
          source_css = Path('landing-stable-20260915.css')
          fresh_css = Path('landing-render-reflow-20260915.css')

          css = source_css.read_text(encoding='utf-8')
          fresh_css.write_text(css, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          new_link = f'<link rel="stylesheet" href="landing-render-reflow-20260915.css?v={build}">'
          s, n = re.subn(
              r'<link rel="stylesheet" href="landing-stable-20260915\.css\?v=[^"]+">',
              new_link,
              s,
              count=1,
          )
          if n == 0 and 'landing-render-reflow-20260915.css' not in s:
              s = s.replace('</head>', new_link + '</head>', 1)

          s, n = re.subn(r'data-build="[^"]+"', f'data-build="{build}"', s, count=1)
          if n == 0:
              s = s.replace('<body>', f'<body data-build="{build}">', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate refresh
        run: |
          grep -q 'landing-render-reflow-20260915.css?v=20260915-1815' index.html
          grep -q 'data-build="20260915-1815"' index.html
          grep -q 'Render desktop reflow 2026-09-15' landing-render-reflow-20260915.css
      - name: Commit refreshed source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html landing-render-reflow-20260915.css
          git commit -m "Force fresh render reflow asset" || exit 0
          git push
