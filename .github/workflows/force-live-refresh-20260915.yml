name: Publish render visual v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-live-refresh-20260915.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild render section with native-size visual and HTML workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          build = '20260915-1835'
          source_css = Path('landing-render-reflow-20260915.css')
          fresh_css = Path('landing-render-visual-v2-20260915.css')

          css = source_css.read_text(encoding='utf-8')
          css += r'''

/* RENDER VISUAL V2 2026-09-15 18:35
   Keep the 720px source near native size; move all information to real HTML. */
.render-pro-media{box-sizing:border-box;min-width:0;width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,300px);gap:14px;align-items:stretch}
.render-main-shot{position:relative;box-sizing:border-box;margin:0;min-width:0;overflow:hidden;border-radius:20px;border:1px solid rgba(255,255,255,.20);background:#102f49;box-shadow:0 24px 58px rgba(0,0,0,.26)}
.render-main-shot img{display:block;width:100%;max-width:720px;height:100%;min-height:100%;margin-inline:auto;object-fit:contain;object-position:center;background:#102f49;visibility:visible;opacity:1}
.render-main-shot::after{content:"Immagine di esempio · il flusso è spiegato qui accanto";position:absolute;left:14px;bottom:14px;max-width:calc(100% - 28px);padding:8px 11px;border-radius:999px;background:rgba(5,30,51,.86);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:12px;font-weight:800;line-height:1.2;backdrop-filter:blur(6px)}
.render-flow{display:grid;grid-template-columns:1fr;gap:10px;align-content:stretch}
.render-flow-step{display:grid;grid-template-columns:38px minmax(0,1fr);gap:11px;align-items:start;padding:14px;border-radius:16px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.075);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.render-flow-num{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;background:#fff;color:#0b3658;font-size:13px;font-weight:900;line-height:1}
.render-flow-step strong{display:block;margin:1px 0 4px;color:#fff;font-size:16px;line-height:1.22}
.render-flow-step p{margin:0;color:#d7e9f4;font-size:13.5px;line-height:1.45}
.render-flow-foot{padding:13px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(42,167,224,.20),rgba(255,255,255,.07));border:1px solid rgba(127,216,255,.25);color:#eaf7fd;font-size:13.5px;line-height:1.45}
.render-flow-foot strong{display:block;margin-bottom:3px;color:#fff;font-size:15px}

@media(min-width:1180px){
  .render-pro-layout{width:min(1400px,calc(100% - 56px))!important;grid-template-columns:repeat(12,minmax(0,1fr))!important;grid-template-rows:auto auto auto auto auto!important;column-gap:28px!important;row-gap:22px!important;align-items:start!important}
  .render-copy{display:contents!important}
  .render-copy>.eyebrow{grid-column:1/5!important;grid-row:1!important;margin:0 0 2px!important;align-self:end!important}
  .render-copy>h2{grid-column:1/5!important;grid-row:2!important;margin:0!important;max-width:520px!important;font-size:clamp(38px,3.05vw,52px)!important;line-height:1.06!important;letter-spacing:-.028em!important}
  .render-copy>p{grid-column:1/5!important;grid-row:3!important;margin:0!important;max-width:520px!important;font-size:17px!important;line-height:1.58!important;color:#d6e7f3!important}
  .render-pro-media{grid-column:5/-1!important;grid-row:1/4!important;align-self:start!important;grid-template-columns:minmax(0,650px) minmax(260px,1fr)!important;justify-content:end!important;gap:16px!important}
  .render-main-shot{min-height:0!important}
  .render-main-shot img{width:100%!important;max-width:650px!important;height:auto!important;min-height:0!important;aspect-ratio:16/9!important;object-fit:contain!important}
  .render-points{grid-column:1/-1!important;grid-row:4!important;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:14px!important;margin:6px 0 0!important;padding:0!important}
  .render-points li{min-height:86px!important;display:flex!important;align-items:center!important;margin:0!important;padding:16px 16px 16px 46px!important;font-size:16px!important;line-height:1.42!important;border-radius:14px!important}
  .render-points li::before{left:16px!important;top:50%!important;transform:translateY(-50%)!important;font-size:20px!important}
  .render-location-note{grid-column:1/11!important;grid-row:5!important;margin:0!important;padding:16px 20px!important;align-self:stretch!important;font-size:15px!important;line-height:1.55!important}
  .render-location-note strong{display:inline!important;margin:0 8px 0 0!important}
  .render-location-note span{display:inline!important}
  .render-actions{grid-column:11/-1!important;grid-row:5!important;margin:0!important;align-self:center!important;justify-self:stretch!important;display:flex!important;justify-content:flex-end!important}
  .render-actions .button.primary{width:100%!important;max-width:240px!important;justify-content:center!important;text-align:center!important;padding:15px 18px!important}
}

@media(max-width:1179px){
  .render-pro-media{grid-template-columns:minmax(0,1fr) minmax(240px,300px)}
}
@media(max-width:900px){
  .render-pro-media{grid-template-columns:1fr}
  .render-main-shot img{height:auto;min-height:0;aspect-ratio:16/9;object-fit:contain}
  .render-flow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .render-flow-foot{grid-column:1/-1}
}
@media(max-width:640px){
  .render-pro-media{gap:12px}
  .render-main-shot{border-radius:16px}
  .render-main-shot::after{left:10px;right:10px;bottom:10px;max-width:none;border-radius:12px;text-align:center;font-size:11.5px}
  .render-flow{grid-template-columns:1fr;gap:9px}
  .render-flow-step{padding:12px 13px}
  .render-flow-foot{grid-column:auto;padding:12px 13px}
}
'''
          fresh_css.write_text(css, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacement = '''<div class="render-pro-media" aria-label="Dal rilievo e dal modello tecnico al render fotorealistico"><figure class="render-main-shot"><img src="assets/render-final-pc-20260915.jpg?v=20260915-1725" width="720" height="405" loading="eager" decoding="async" alt="Esempio di trasformazione da rilievo e modello tecnico a render fotorealistico"></figure><div class="render-flow" aria-label="Flusso di lavoro render"><article class="render-flow-step"><span class="render-flow-num">01</span><div><strong>Dati di partenza</strong><p>Foto, rilievi, nuvole di punti ed elaborati tecnici.</p></div></article><article class="render-flow-step"><span class="render-flow-num">02</span><div><strong>Modello 3D</strong><p>Geometria, materiali, proporzioni e ottimizzazione.</p></div></article><article class="render-flow-step"><span class="render-flow-num">03</span><div><strong>Render fotorealistico</strong><p>Luci, atmosfera, inquadratura e resa finale.</p></div></article><div class="render-flow-foot"><strong>Informazioni sempre leggibili</strong>Il processo non dipende più dal testo incorporato nell’immagine: i contenuti principali sono testo HTML nitido a qualsiasi risoluzione.</div></div></div>'''

          s, n = re.subn(r'<figure class="render-pro-figure"[^>]*>.*?</figure>', replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one render-pro-figure, found {n}')

          new_link = f'<link rel="stylesheet" href="landing-render-visual-v2-20260915.css?v={build}">'
          s, n = re.subn(r'<link rel="stylesheet" href="landing-render-reflow-20260915\.css\?v=[^"]+">', new_link, s, count=1)
          if n == 0:
              s, n = re.subn(r'<link rel="stylesheet" href="landing-stable-20260915\.css\?v=[^"]+">', new_link, s, count=1)
          if n == 0 and 'landing-render-visual-v2-20260915.css' not in s:
              s = s.replace('</head>', new_link + '</head>', 1)

          s, n = re.subn(r'data-build="[^"]+"', f'data-build="{build}"', s, count=1)
          if n == 0:
              s = s.replace('<body>', f'<body data-build="{build}">', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate render v2
        run: |
          grep -q 'landing-render-visual-v2-20260915.css?v=20260915-1835' index.html
          grep -q 'data-build="20260915-1835"' index.html
          grep -q 'render-pro-media' index.html
          grep -q 'Informazioni sempre leggibili' index.html
          grep -q 'RENDER VISUAL V2 2026-09-15 18:35' landing-render-visual-v2-20260915.css
          grep -q 'max-width:650px!important' landing-render-visual-v2-20260915.css
      - name: Commit render visual v2
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html landing-render-visual-v2-20260915.css
          git commit -m "Rebuild render visual for readability" || exit 0
          git push
