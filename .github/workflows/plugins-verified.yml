name: Plugin pages quality and live verification
on:
  workflow_dispatch:
  push:
    branches: [main, 'release/yqarch-*', 'release/site-*', 'optimize/plugins-*', 'optimize/services-site-*']
    paths:
      - 'index.html'
      - 'yqarch-italiano/**'
      - 'express-tools-italiano/**'
      - 'ag-cad-tools/**'
      - 'blockhub-cad/**'
      - 'contatti/**'
      - 'portfolio/**'
      - 'recensioni/**'
      - 'assets/site-header.*'
      - 'assets/site-pages.css'
      - 'assets/contact.js'
      - 'assets/reviews-*.js'
      - 'scripts/qa-site-expansion.cjs'
      - 'scripts/sync-site-header.cjs'
      - 'scripts/sync-download-checksums.cjs'
      - 'scripts/test-site-expansion.mjs'
      - 'assets/plugins/**'
      - 'assets/services/**'
      - 'assets/site-footer.css'
      - 'partials/**'
      - 'scripts/sync-site-footer.cjs'
      - 'scripts/sync-page-navigation.cjs'
      - 'scripts/site-pages.json'
      - 'scripts/test-site-navigation.cjs'
      - 'scripts/test-property-deliverables.mjs'
      - 'scripts/qa-landing-20260930.cjs'
      - 'scripts/qa-form-guidance.cjs'
      - 'scripts/test-form-guidance.mjs'
      - 'lezioni-autocad/**'
      - '.github/scripts/site_consistency_qa.cjs'
      - 'downloads/**'
      - 'cloudflare-worker/**'
      - 'scripts/test-plugin*'
      - '.github/scripts/plugins_qa.cjs'
      - '.github/workflows/plugins-verified.yml'
permissions:
  contents: read
concurrency:
  group: plugins-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies and browsers
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium webkit firefox
      - name: Unit and security checks; all submissions are simulated
        run: node --test scripts/test-*.mjs scripts/test-*.cjs
      - name: Desktop and mobile browser verification
        run: |
          node scripts/sync-site-footer.cjs --check
          node scripts/sync-page-navigation.cjs --check
          node scripts/sync-site-header.cjs --check
          node scripts/sync-download-checksums.cjs --check
      - name: New site paths, private contacts and navigation
        run: node scripts/qa-site-expansion.cjs local
      - name: Complete quote flow, retry and informative PDF
        run: node scripts/qa-preventivo-flow.cjs local
      - name: Local plugin interactions
        run: node .github/scripts/plugins_qa.cjs local
      - name: Local cross-page consistency
        run: node .github/scripts/site_consistency_qa.cjs local
      - name: Local landing interactions
        run: node scripts/qa-landing-20260930.cjs local
      - name: Local guided form interactions
        run: node scripts/qa-form-guidance.cjs local
      - name: Wait for public pages
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import time,urllib.request
          for attempt in range(36):
            try:
              for slug in ['yqarch-italiano','ag-cad-tools']:
                html=urllib.request.urlopen('https://andreagiaquinto.it/'+slug+'/',timeout=15).read().decode()
                import pathlib,re
                expected=re.search(r'data-build="([^"]+)"',pathlib.Path(slug+'/index.html').read_text()).group(1)
                assert 'data-build="'+expected+'"' in html
              break
            except Exception:
              if attempt==35:raise
              time.sleep(10)
          PY
      - name: Public downloads, API and browser verification
        if: github.ref == 'refs/heads/main'
        run: node .github/scripts/plugins_qa.cjs live
      - name: Live quote flow with intercepted requests
        if: github.ref == 'refs/heads/main'
        run: node scripts/qa-preventivo-flow.cjs live
      - name: Live new site paths and simulated contact form
        if: github.ref == 'refs/heads/main'
        run: node scripts/qa-site-expansion.cjs live
      - name: Live cross-page consistency
        if: github.ref == 'refs/heads/main'
        run: node .github/scripts/site_consistency_qa.cjs live
      - name: Live landing interactions
        if: github.ref == 'refs/heads/main'
        run: node scripts/qa-landing-20260930.cjs live
      - name: Live guided form interactions
        if: github.ref == 'refs/heads/main'
        run: node scripts/qa-form-guidance.cjs live
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-pages-${{ github.sha }}
          path: |
            ${{ runner.temp }}/plugins-proof/
            ${{ runner.temp }}/quote-flow-proof/
            ${{ runner.temp }}/landing-proof/
            ${{ runner.temp }}/form-guidance-proof/
          retention-days: 30
