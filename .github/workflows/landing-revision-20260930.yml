name: Landing revision 20260930
on:
  push:
    branches: [revisione-landing-20260930]
    paths:
      - '.github/workflows/landing-revision-20260930.yml'
      - '.github/scripts/landing-update-20260930.py'
      - '.github/scripts/landing-polish-20260930.py'
      - 'scripts/qa-landing-20260930.cjs'
      - 'scripts/test-site-navigation.cjs'
      - 'scripts/test-property-deliverables.mjs'
permissions:
  contents: write
concurrency:
  group: landing-revision-candidate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: revisione-landing-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python verification dependencies
        run: python -m pip install beautifulsoup4 pillow requests playwright==1.58.0
      - name: Apply reviewed candidate on isolated branch only
        id: apply
        run: |
          python .github/scripts/landing-update-20260930.py
          python .github/scripts/landing-polish-20260930.py
          node scripts/sync-page-navigation.cjs --check
          node scripts/sync-site-footer.cjs --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html lezioni-autocad/index.html lezioni-autocad/AGENTS.md yqarch-italiano/index.html express-tools-italiano/index.html express-tools-italiano/guida/index.html downloads/yqarch/YQArch_Italiano_3.64_GUIDA.html downloads/yqarch/YQArch_Italiano_3.64_REPORT.html downloads/express-tools/Express_Tools_Italiano_3.2-rc1_Report.html assets/services/services.css assets/site-footer.css partials/site-footer.html scripts/site-pages.json scripts/sync-page-navigation.cjs scripts/sync-site-footer.cjs scripts/qa-landing-20260930.cjs privacy/index.html 404.html report-google AGENTS.md sitemap.xml .github/PLUGINS-PUBLICATION.md .github/SERVICES-PUBLICATION.md .github/services-publication.json .github/scripts/plugins_qa.cjs .github/scripts/services_qa.py .github/scripts/site_consistency_qa.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Complete candidate metadata and test-harness correction'
            git push origin HEAD:revisione-landing-20260930
          fi
          git rev-parse HEAD
          git archive --format=zip HEAD -o /tmp/landing-candidate.zip
      - name: Install JS test dependencies and browser engines
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium firefox webkit
      - name: Unit, security, navigation and quote contracts
        id: unit
        run: npm test
      - name: New visual offer and secondary navigation
        if: always() && steps.apply.outcome == 'success'
        run: node scripts/qa-landing-20260930.cjs local
      - name: Existing plugin and common-site browser regression
        if: always() && steps.apply.outcome == 'success'
        run: |
          node .github/scripts/plugins_qa.cjs local
          node .github/scripts/site_consistency_qa.cjs local
      - name: Existing services regression
        if: always() && steps.apply.outcome == 'success'
        run: python .github/scripts/services_qa.py local
      - name: Save source and actual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-candidate-proof
          path: |
            /tmp/landing-candidate.zip
            ${{ runner.temp }}/landing-proof/
            ${{ runner.temp }}/plugins-proof/
            ${{ runner.temp }}/services-restored-proof/
          retention-days: 7
