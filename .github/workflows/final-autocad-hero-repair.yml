name: Final AutoCAD hero repair
on:
  push:
    paths:
      - '.github/workflows/final-autocad-hero-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final repair
        run: python .github/scripts/final_autocad_repair.py
      - name: Commit repaired landing and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-autocad-hero-v2.yml
          rm -f .github/workflows/final-autocad-hero-repair.yml
          rm -f .github/scripts/final_autocad_repair.py
          git config user.name 'andreagiaqui-83'
          git config user.email 'andrea.giaqui@gmail.com'
          git add -A
          git commit -m 'Ripara definitivamente hero AutoCAD senza regressioni'
          git push origin HEAD:main
