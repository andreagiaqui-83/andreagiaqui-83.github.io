name: Final AutoCAD hero repair V15
on:
  push:
    paths:
      - '.github/workflows/final-autocad-hero-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final repair V15
        run: python .github/scripts/final_autocad_repair.py
      - name: Commit verified landing and remove temporary repair files
        run: |
          rm -f .github/workflows/fix-autocad-hero-v2.yml
          rm -f .github/workflows/final-autocad-hero-repair.yml
          rm -f .github/scripts/final_autocad_repair.py
          rm -f .github/scripts/portrait.b64
          rm -f .github/scripts/portrait.part1 .github/scripts/portrait.part2 .github/scripts/portrait.part3 .github/scripts/portrait.part4
          rm -f .github/scripts/portrait.p1a .github/scripts/portrait.p1b .github/scripts/portrait.p1c .github/scripts/portrait.p1d
          rm -f lezioni-autocad/assets/andrea-giaquinto-autocad.svg
          git config user.name 'andreagiaqui-83'
          git config user.email 'andrea.giaqui@gmail.com'
          git add -A
          git commit -m 'Ripara definitivamente hero AutoCAD V15 senza regressioni'
          git push origin HEAD:main
