<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verifica temporanea AutoCAD</title><style>body{margin:0;background:#ddd;font:14px system-ui}header{padding:12px;background:white;position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:12px;align-items:center}button,select{padding:8px}#wrap{overflow:hidden;margin:12px auto}iframe{border:0;transform-origin:top left;background:#081522}pre{margin:12px;white-space:pre-wrap;font-size:11px}label{display:flex;align-items:center;gap:8px}</style></head><body><header><strong>QA temporanea · nessun invio reale</strong><label>Larghezza<select id="width"><option>320</option><option>360</option><option>375</option><option selected>390</option><option>412</option><option>430</option><option>600</option><option>768</option><option>800</option><option>1024</option><option>1366</option><option>1440</option><option>1920</option></select></label><label>Sezione<select id="section"><option value="top">Hero</option><option value="metodo">Metodo</option><option value="programma">Programma</option><option value="studenti">Destinatari</option><option value="visual">Immagine centrale</option><option value="prezzi">Prezzo</option><option value="recensioni">Recensioni</option><option value="faq">FAQ</option><option value="contatti">Modulo</option><option value="footer">Footer</option></select></label><button id="measure">Misura</button><button id="suite">Tutte le larghezze</button><button id="axe">Accessibilità</button><button id="cookies">Cookie</button><button id="network">Rete e backend</button></header><div id="wrap"><iframe id="frame" title="Anteprima responsive landing" src="/lezioni-autocad/"></iframe></div><pre id="results" aria-live="polite"></pre><script>
const frame=document.querySelector('#frame'),wrap=document.querySelector('#wrap'),width=document.querySelector('#width'),section=document.querySelector('#section'),out=document.querySelector('#results');let lastMetrics;
function resize(){const w=Number(width.value),scale=Math.min(1,(innerWidth-32)/w),h=Math.round((innerHeight-100)/scale);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';wrap.style.width=w*scale+'px';wrap.style.height=h*scale+'px';}
function scrollSection(){const doc=frame.contentDocument;const s=section.value;const target=s==='visual'?doc.querySelector('.visual-section'):s==='footer'?doc.querySelector('footer'):doc.getElementById(s);if(target)frame.contentWindow.scrollTo({top:target.offsetTop-84,behavior:'instant'});}
document.querySelector('#network').onclick=async()=>{const results=[];for(const path of ['/','/lezioni-autocad/','/privacy/','/sitemap.xml','/robots.txt','/not-found-qa-v17/','https://cad-bim-preventivi.andrea-giaqui.workers.dev/health','https://cad-bim-preventivi.andrea-giaqui.workers.dev/api/reviews?source=autocad-lessons']){try{const r=await fetch(path,{cache:'no-store'});results.push({path,status:r.status,url:r.url,type:r.headers.get('content-type')});}catch(e){results.push({path,error:e.message});}}try{const r=await fetch('https://cad-bim-preventivi.andrea-giaqui.workers.dev/api/lessons',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});results.push({path:'/api/lessons invalid payload - no email',status:r.status,body:await r.json()});}catch(e){results.push({error:e.message});}out.textContent=JSON.stringify(results,null,2);};function metrics(){const win=frame.contentWindow,doc=frame.contentDocument;const vw=win.innerWidth;return{width:vw,clientWidth:doc.documentElement.clientWidth,scrollWidth:doc.documentElement.scrollWidth,overflow:doc.documentElement.scrollWidth>doc.documentElement.clientWidth,build:doc.body.dataset.build,lcp_ms:doc.documentElement.dataset.qaLcp,cls:doc.documentElement.dataset.qaCls,brokenImages:[...doc.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src')),outside:[...doc.querySelectorAll('h1,h2,h3,.btn,.program-card,.form-panel,.hero-banner,.price-card')].filter(x=>{const r=x.getBoundingClientRect();return r.width&& (r.right>vw+1||r.left< -1)}).map(x=>({tag:x.tagName,text:x.textContent.trim().slice(0,55)})),googleResources:win.performance.getEntriesByType('resource').filter(x=>/google-analytics|googletagmanager|doubleclick/.test(x.name)).length,resources:win.performance.getEntriesByType('resource').filter(x=>/andreagiaquinto.it/.test(x.name)).map(x=>({name:x.name.split('/').pop(),transfer:x.transferSize,decoded:x.decodedBodySize,duration:Math.round(x.duration)}))};}
width.addEventListener('change',()=>{resize();setTimeout(()=>out.textContent=JSON.stringify(metrics(),null,2),300)});section.addEventListener('change',scrollSection);document.querySelector('#measure').onclick=()=>{lastMetrics=metrics();out.textContent=JSON.stringify(lastMetrics,null,2)};document.querySelector('#suite').onclick=async()=>{const data=[];for(const size of [320,360,375,390,412,430,600,768,800,1024,1366,1440,1920]){width.value=String(size);resize();await new Promise(r=>setTimeout(r,180));const m=metrics();delete m.resources;data.push(m);}out.textContent=JSON.stringify(data,null,2);width.value='390';resize();};document.querySelector('#axe').onclick=async()=>{const doc=frame.contentDocument;const script=doc.createElement('script');script.src='/_qa-autocad/axe.min.js';script.onload=async()=>{const result=await frame.contentWindow.axe.run(doc,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa']}});out.textContent=JSON.stringify({passes:result.passes.length,violations:result.violations.map(x=>({id:x.id,impact:x.impact,help:x.help,nodes:x.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),incomplete:result.incomplete.map(x=>x.id)},null,2)};doc.head.append(script);};document.querySelector('#cookies').onclick=()=>frame.contentDocument.querySelector('[data-consent-open]').click();frame.addEventListener('load',()=>{resize();const doc=frame.contentDocument;new frame.contentWindow.PerformanceObserver(list=>{doc.documentElement.dataset.qaLcp=String(Math.round(list.getEntries().at(-1).startTime));}).observe({type:'largest-contentful-paint',buffered:true});let cls=0;new frame.contentWindow.PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput)cls+=e.value;doc.documentElement.dataset.qaCls=String(cls);}).observe({type:'layout-shift',buffered:true});});resize();
</script></body></html>
