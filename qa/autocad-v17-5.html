<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verifica responsive AutoCAD 17.5</title>
<style>body{margin:0;background:#dce3e9;color:#102030;font:14px/1.5 system-ui,sans-serif}header{padding:14px 20px;background:white}label{display:inline-block;margin-right:20px}select{font:inherit;padding:8px}main{padding:20px}#stage{margin:auto}iframe{border:0;display:block;transform-origin:top left;background:#081522}p{margin:8px 0 0;font-size:12px}</style></head>
<body><header><label>Larghezza <select id="width"><option>320</option><option>360</option><option>375</option><option selected>390</option><option>412</option><option>430</option><option>600</option><option>768</option><option>800</option><option>1024</option><option>1366</option><option>1440</option><option>1920</option></select></label><label>Sezione <select id="section"><option value="top">Inizio</option><option value="programma">Programma</option><option value="prezzi">Prezzi</option><option value="recensioni">Recensioni</option><option value="faq">FAQ</option><option value="contatti">Contatti</option></select></label><label>Versione <select id="variant"><option value="">Pubblicata</option><option value="?anteprima=senza-render">Senza render</option></select></label><p>Controllo temporaneo della pagina pubblica. La cornice viene ridotta solo per mostrarla sullo schermo; il contenuto usa la larghezza selezionata.</p></header>
<main><div id="stage"><iframe id="qaFrame" title="Landing AutoCAD alla larghezza selezionata" src="/lezioni-autocad/#top" width="390" height="900"></iframe></div></main>
<script>
const frame=document.querySelector('#qaFrame'),stage=document.querySelector('#stage'),width=document.querySelector('#width'),section=document.querySelector('#section'),variant=document.querySelector('#variant');
function size(){const w=Number(width.value),scale=Math.min(1,(document.documentElement.clientWidth-40)/w);frame.style.width=w+'px';frame.style.height='900px';frame.style.transform='scale('+scale+')';stage.style.width=w*scale+'px';stage.style.height=900*scale+'px';}
function navigate(){frame.src='/lezioni-autocad/'+variant.value+'#'+section.value;}
width.addEventListener('change',size);section.addEventListener('change',navigate);variant.addEventListener('change',navigate);window.addEventListener('resize',size);size();
</script></body></html>
